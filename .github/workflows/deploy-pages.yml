name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure GitHub Pages uses GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          BRANCH="${{ github.event.repository.default_branch }}"
          if ! gh api "repos/${REPO}/pages" >/dev/null 2>&1; then
            jq -n --arg branch "$BRANCH" '{build_type:"workflow",source:{branch:$branch,path:"/"}}' \
              | gh api -X POST "repos/${REPO}/pages" --input -
          else
            gh api -X PUT "repos/${REPO}/pages" -f build_type=workflow
          fi

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /home-gym/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
